name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` runs `tsc -b && rsbuild build` (production), which also
      # emits dist/bundle-modules.json via EmitBundleModulesPlugin and runs the
      # ForbidNodeOnlyBrowserImports resolve tripwire.
      - name: Typecheck + build
        run: npm run build

      # Asserts no @modelcontextprotocol/sdk in the browser output and a single
      # manifest-mcp-core + manifestjs copy. Requires the build above.
      - name: Browser-safety bundle guard
        run: npm run check:bundle
